name: CI/CD - Docker Build, Push to ECR & Deploy to EKS

on:
  push:
    branches:
      - dev  # Runs on push to main branch

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: 329599658188.dkr.ecr.us-east-2.amazonaws.com
  CLUSTER_NAME: demo-eks-4RL5PjeX
  DEPLOYMENT_NAME: my-app
  CONTAINER_NAME: new
  IMAGE_TAG: latest

jobs:
  build-and-push:
    name: Build & Push Docker Image to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 329599658188.dkr.ecr.us-east-2.amazonaws.com

      - name: Build & Tag Docker Image
        run: |
          docker build -t new .
          docker tag new:latest 329599658188.dkr.ecr.us-east-2.amazonaws.com/new:latest

      - name: Push Docker Image to ECR
        run: |
          docker push 329599658188.dkr.ecr.us-east-2.amazonaws.com/new:latest

  deploy:
    name: Deploy to Kubernetes (EKS)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name $CLUSTER_NAME --region us-east-2

